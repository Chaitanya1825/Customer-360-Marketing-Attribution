<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#151D30" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #FFFFFF; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 16px; fill: #94A3B8; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #38BDF8; letter-spacing: 1.5px; text-transform: uppercase; }
    .metric-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 22px; fill: #F8FAFC; }
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 11px; fill: #64748B; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #CBD5E1; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="150" cy="80" r="120" fill="#0284C7" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="180" r="140" fill="#7C3AED" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="300" r="100" fill="#0D9488" opacity="0.08" filter="url(#glow)" />

  <!-- Platform Badge -->
  <g transform="translate(60, 48)">
    <rect width="180" height="26" rx="13" fill="#0369A1" fill-opacity="0.25" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#38BDF8" />
    <text x="26" y="17" class="tag">ENTERPRISE ANALYTICS</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 118)">
    <text class="title">Customer 360 <tspan fill="url(#accent-grad)">&amp; Marketing Attribution</tspan></text>
    <text y="34" class="subtitle">Production Data Platform • GA4 Session Stitching • RFM Segmentation • Multi-Touch Attribution • BigQuery • dbt Core • Streamlit • Tableau</text>
  </g>

  <!-- Metric Highlights Cards -->
  <g transform="translate(60, 195)">
    <!-- Card 1: Attributed Revenue -->
    <rect x="0" y="0" width="250" height="74" rx="10" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1" />
    <rect x="0" y="0" width="4" height="74" rx="2" fill="#38BDF8" />
    <text x="20" y="32" class="metric-value">$240,669.11</text>
    <text x="20" y="54" class="metric-label">Total Pipeline Revenue</text>

    <!-- Card 2: Orders & Customers -->
    <rect x="270" y="0" width="250" height="74" rx="10" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1" />
    <rect x="270" y="0" width="4" height="74" rx="2" fill="#818CF8" />
    <text x="290" y="32" class="metric-value">1,231 Orders · 500 Cust</text>
    <text x="290" y="54" class="metric-label">Identity Resolution (80% Match)</text>

    <!-- Card 3: Attribution Models -->
    <rect x="540" y="0" width="250" height="74" rx="10" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1" />
    <rect x="540" y="0" width="4" height="74" rx="2" fill="#34D399" />
    <text x="560" y="32" class="metric-value">4 Attribution Models</text>
    <text x="560" y="54" class="metric-label">First · Last · Linear · Time-Decay</text>

    <!-- Card 4: dbt Test Coverage -->
    <rect x="810" y="0" width="250" height="74" rx="10" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1" />
    <rect x="810" y="0" width="4" height="74" rx="2" fill="#F472B6" />
    <text x="830" y="32" class="metric-value">40 dbt Tests Passed</text>
    <text x="830" y="54" class="metric-label">Automated Schema &amp; Singular Asserts</text>
  </g>

  <!-- Bottom Technology Badges -->
  <g transform="translate(60, 305)">
    <!-- Badge 1: Google BigQuery -->
    <rect x="0" y="0" width="160" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="14" y="18" class="badge-text">⚡ Google BigQuery</text>

    <!-- Badge 2: dbt Core -->
    <rect x="175" y="0" width="110" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="190" y="18" class="badge-text">🟧 dbt Core</text>

    <!-- Badge 3: Streamlit -->
    <rect x="300" y="0" width="115" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="315" y="18" class="badge-text">🔴 Streamlit</text>

    <!-- Badge 4: Tableau Public -->
    <rect x="430" y="0" width="140" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="445" y="18" class="badge-text">📊 Tableau Public</text>

    <!-- Badge 5: Python 3.11+ -->
    <rect x="585" y="0" width="105" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="600" y="18" class="badge-text">🐍 Python 3.11</text>

    <!-- Badge 6: Plotly -->
    <rect x="705" y="0" width="100" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="720" y="18" class="badge-text">📈 Plotly.js</text>
  </g>
</svg>
